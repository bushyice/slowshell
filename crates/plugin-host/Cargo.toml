[package]
name = "slowshell-plugin-host"
version.workspace = true
license.workspace = true
edition = "2024"

[features]
default = ["spotlight", "panels"]
spotlight = ["slowshell-spotlight"]
panels = ["slowshell-components"]

[dependencies]
slowshell-plugin-abi = { path = "../plugin-abi" }
slowshell-registry = { path = "../registry" }
slowshell-core = { path = "../core" }
slowshell-config = { path = "../config" }
slowshell-commons = { path = "../commons" }
slowshell-components = { path = "../components", optional = true, default-features = false }
slowshell-compositor = { path = "../compositor", default-features = false }
slowshell-desktop = { path = "../desktop" }
slowshell-spotlight = { path = "../spotlight", optional = true }
slowshell-widgets = { path = "../widgets" }
abi_stable = "0.11.3"
icss.workspace = true
iced.workspace = true
iced_exwlshell.workspace = true
kdl.workspace = true
miette.workspace = true
semver.workspace = true
futures-channel.workspace = true
image.workspace = true
nix.workspace = true
iced_anim.workspace = true

[dev-dependencies]
tokio.workspace = true
