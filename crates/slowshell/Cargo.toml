[package]
name = "slowshell"
version.workspace = true
license.workspace = true
edition = "2024"

[features]
default = [
  "base",
  "compositors",
  "components",
  "services",
  "animations"
]

base = [
  "panels",
  "background",
  "widgets",
  "plugins",
  "spotlight",
  "notifications",
]

compositors = [
  "compositor-niri",
  "compositor-sway",
  "compositor-hyprland",
  "compositor-fallback",
]

components = [
  "components-audio",
  "components-bluetooth",
  "components-network",
  "components-notifications",
  "components-power",
  "components-tray",
  "components-notch",
]

panels = [
  "dep:slowshell-panels",
  "dep:slowshell-popups",
  "dep:slowshell-components",
  "slowshell-plugin-host?/panels",
]
popups = ["dep:slowshell-popups"]
background = ["dep:slowshell-background"]
widgets = ["dep:slowshell-background"]
plugins = ["dep:slowshell-plugin-host"]
spotlight = ["dep:slowshell-spotlight", "slowshell-plugin-host?/spotlight"]
notifications = [
  "dep:slowshell-notifications",
  "services-notifications",
]

compositor-niri = ["slowshell-compositor/niri"]
compositor-sway = ["slowshell-compositor/sway"]
compositor-hyprland = ["slowshell-compositor/hyprland"]
compositor-fallback = ["slowshell-compositor/fallback"]

services = [
  "services-audio",
  "services-bluetooth",
  "services-network",
  "services-notifications",
  "services-power",
  "services-tray",
]

services-audio = ["slowshell-services/audio"]
services-bluetooth = ["slowshell-services/bluetooth"]
services-network = ["slowshell-services/network"]
services-notifications = ["slowshell-services/notifications"]
services-power = ["slowshell-services/power"]
services-tray = ["slowshell-services/tray"]

components-audio = ["slowshell-components?/audio", "slowshell-background?/audio", "slowshell-plugin-host?/service-audio", "services-audio"]
components-bluetooth = ["slowshell-components?/bluetooth", "slowshell-plugin-host?/service-bluetooth", "services-bluetooth"]
components-network = ["slowshell-components?/network", "slowshell-plugin-host?/service-network", "services-network"]
components-notifications = ["slowshell-components?/notifications", "slowshell-plugin-host?/service-notifications", "services-notifications"]
components-power = ["slowshell-components?/power", "slowshell-plugin-host?/service-power", "services-power"]
components-tray = ["slowshell-components?/tray", "slowshell-plugin-host?/service-tray", "services-tray"]
components-notch = ["slowshell-components?/notch"]

animations = []

[dependencies]
slowshell-core = { path = "../core" }
slowshell-config = { path = "../config" }
slowshell-desktop = { path = "../desktop" }
slowshell-registry = { path = "../registry" }
slowshell-compositor = { path = "../compositor", default-features = false }
slowshell-notifications = { path = "../notifications", optional = true }
slowshell-panels = { path = "../panels", optional = true }
slowshell-spotlight = { path = "../spotlight", optional = true }
slowshell-ipc = { path = "../ipc" }
slowshell-widgets = { path = "../widgets" }
slowshell-components = { path = "../components", optional = true, default-features = false }
slowshell-menus = { path = "../menus" }
slowshell-popups = { path = "../popups", optional = true }
slowshell-services = { path = "../services", default-features = false }
slowshell-background = { path = "../background", optional = true }
slowshell-plugin-host = { path = "../plugin-host", optional = true, default-features = false }

nix.workspace = true
libc.workspace = true
miette.workspace = true
iced.workspace = true
iced_exwlshell.workspace = true
futures-channel.workspace = true
futures-lite = "2"
clap.workspace = true
