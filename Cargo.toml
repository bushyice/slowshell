[workspace]
members = [
  "crates/background",
  "crates/commons",
  "crates/components",
  "crates/compositor",
  "crates/config",
  "crates/core",
  "crates/desktop",
  "crates/ipc",
  "crates/menus",
  "crates/notifications",
  "crates/panels",
  "crates/plugin",
  "crates/plugin-host",
  "crates/plugin-sdk",
  "crates/popups",
  "crates/registry",
  "crates/services",
  "crates/slowshell",
  "crates/spotlight",
  "crates/widgets",
  "xtask"
]
default-members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.2"

[workspace.dependencies]
iced = { version = "0.14.0", features = ["image", "tokio", "svg", "lazy", "wgpu", "advanced"] }
iced_layershell = "0.19.1"
iced_anim = { version = "0.3", default-features = false }
chrono = "0.4"
image = "0.25"
libc = "0.2"
futures-channel = "0.3"
ductor = { version = "0.1" }
miette = { version = "7.6", features = ["derive", "fancy"] }
thiserror = "2"
nix = { version = "0.31", features = ["socket", "poll", "user", "ioctl", "signal", "event", "time", "fs"] }
smol_str = { version = "0.3", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", default-features = false, features = ["net", "rt-multi-thread", "macros", "sync", "time"] }
niri-ipc = { version = "26.4", features = ["json-schema"] }
async-trait = "0.1.91"
serde_json = "1"
kdl = "6"
freedesktop-icons = "0.4.0"
system-tray = "0.8"
freedesktop-desktop-entry = "0.8.2"
zbus = "5"
async-io = "2"
futures-util = "0.3"
ron = "0.12.2"
clap = { version = "4.6.6", features = ["derive"] }
libloading = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
