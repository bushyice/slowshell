
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwayland-dev \
            libwayland-bin \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libvulkan-dev

      - name: Build
        run: cargo build --release --locked -p slowshell --bin slowshell

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          pkg="slowshell-${version}"
          mkdir -p "dist/$pkg"

          cp target/release/slowshell "dist/$pkg/slowshell"
          for extra in assets themes example.kdl README.md; do
            [ -e "$extra" ] && cp -r "$extra" "dist/$pkg/"
          done

          tar -czf "dist/$pkg.tar.gz" -C dist "$pkg"
          sha256sum "dist/$pkg.tar.gz" > "dist/$pkg.tar.gz.sha256"
          echo "packaged dist/$pkg.tar.gz"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
          echo "published $GITHUB_REF_NAME"
